<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 800 600" width="800" height="600">
  <defs>
    <linearGradient id="forestGrad" x1="0%" y1="0%" x2="100%" y2="100%">
      <stop offset="0%" stop-color="#143e2b"/>
      <stop offset="50%" stop-color="#1e543b"/>
      <stop offset="100%" stop-color="#0c271b"/>
    </linearGradient>
    <radialGradient id="waterGrad" cx="50%" cy="50%" r="50%">
      <stop offset="0%" stop-color="#2b6cb0"/>
      <stop offset="100%" stop-color="#1a365d"/>
    </radialGradient>
    <pattern id="canopy" width="40" height="40" patternUnits="userSpaceOnUse">
      <circle cx="20" cy="20" r="14" fill="#236345" opacity="0.6"/>
      <circle cx="10" cy="10" r="8" fill="#1b4d36" opacity="0.5"/>
      <circle cx="30" cy="30" r="10" fill="#2d7a56" opacity="0.7"/>
    </pattern>
  </defs>
  <rect width="800" height="600" fill="url(#forestGrad)"/>
  <rect width="800" height="600" fill="url(#canopy)"/>
  <!-- River/Water Body -->
  <path d="M 0 350 Q 200 320 400 420 T 800 390 L 800 480 Q 550 490 380 470 T 0 420 Z" fill="url(#waterGrad)" opacity="0.85"/>
  <!-- Ridges & Elevation contours -->
  <path d="M 100 80 Q 250 150 450 100 T 750 160" stroke="#337755" stroke-width="3" fill="none" opacity="0.4"/>
  <path d="M 50 180 Q 300 240 500 200 T 780 230" stroke="#337755" stroke-width="2" fill="none" opacity="0.4"/>
  <!-- Label badge -->
  <rect x="20" y="20" width="340" height="40" rx="8" fill="#000" fill-opacity="0.65"/>
  <text x="35" y="46" font-family="system-ui, sans-serif" font-size="14" font-weight="bold" fill="#48bb78">SENTINEL-2 • 2023-03-15 • PRE-EVENT BASELINE</text>
</svg>
