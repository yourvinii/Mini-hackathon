<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 600 400" width="100%" height="100%">
  <defs>
    <linearGradient id="sky" x1="0%" y1="0%" x2="0%" y2="100%">
      <stop offset="0%" stop-color="#7dd3fc"/>
      <stop offset="60%" stop-color="#bae6fd"/>
      <stop offset="100%" stop-color="#e0f2fe"/>
    </linearGradient>
    <linearGradient id="ground" x1="0%" y1="0%" x2="0%" y2="100%">
      <stop offset="0%" stop-color="#854d0e"/>
      <stop offset="100%" stop-color="#451a03"/>
    </linearGradient>
    <linearGradient id="log" x1="0%" y1="0%" x2="100%" y2="0%">
      <stop offset="0%" stop-color="#78350f"/>
      <stop offset="50%" stop-color="#b45309"/>
      <stop offset="100%" stop-color="#78350f"/>
    </linearGradient>
  </defs>

  <!-- Sky -->
  <rect x="0" y="0" width="600" height="200" fill="url(#sky)"/>

  <!-- Distant Forest Line (Undisturbed Core) -->
  <path d="M0 200 L40 160 L80 190 L120 150 L160 185 L200 145 L240 180 L280 155 L320 185 L360 140 L400 175 L440 150 L480 180 L520 145 L560 175 L600 155 L600 220 L0 220 Z" fill="#14532d"/>
  <path d="M0 210 L50 175 L100 205 L150 170 L200 195 L260 165 L310 195 L370 160 L430 195 L490 170 L550 195 L600 180 L600 240 L0 240 Z" fill="#166534" opacity="0.9"/>

  <!-- Cleared Muddy Ground -->
  <rect x="0" y="220" width="600" height="180" fill="url(#ground)"/>

  <!-- Heavy Machinery Tire Tracks -->
  <path d="M50 400 L180 230 M70 400 L200 230" stroke="#291305" stroke-width="8" stroke-dasharray="12,8" opacity="0.6"/>
  <path d="M380 400 L320 230 M400 400 L340 230" stroke="#291305" stroke-width="8" stroke-dasharray="12,8" opacity="0.6"/>

  <!-- Stacks of Cut Timber Logs -->
  <!-- Bottom layer -->
  <rect x="160" y="280" width="280" height="30" rx="6" fill="url(#log)"/>
  <rect x="180" y="255" width="240" height="28" rx="6" fill="url(#log)"/>
  <rect x="210" y="230" width="180" height="26" rx="6" fill="url(#log)"/>

  <!-- Cut Log Ends Rings -->
  <circle cx="165" cy="295" r="14" fill="#d97706" stroke="#78350f" stroke-width="3"/>
  <circle cx="165" cy="295" r="8" fill="none" stroke="#78350f" stroke-width="1.5"/>
  <circle cx="165" cy="295" r="3" fill="#78350f"/>

  <circle cx="435" cy="295" r="14" fill="#d97706" stroke="#78350f" stroke-width="3"/>
  <circle cx="435" cy="295" r="8" fill="none" stroke="#78350f" stroke-width="1.5"/>

  <circle cx="185" cy="269" r="13" fill="#f59e0b" stroke="#78350f" stroke-width="3"/>
  <circle cx="185" cy="269" r="6" fill="none" stroke="#78350f" stroke-width="1.5"/>

  <circle cx="215" cy="243" r="12" fill="#fbbf24" stroke="#78350f" stroke-width="3"/>
  <circle cx="215" cy="243" r="5" fill="none" stroke="#78350f" stroke-width="1.5"/>

  <!-- Physical Boundary Demarcation Tape (Yellow Warning) -->
  <path d="M0 320 Q150 330 300 315 T600 325" fill="none" stroke="#eab308" stroke-width="6" stroke-dasharray="24,12"/>
  <text x="50" y="315" fill="#713f12" font-size="10" font-weight="bold" font-family="sans-serif">SANCTUARY BUFFER BOUNDARY - ZERO CLEARING</text>
  <text x="350" y="310" fill="#713f12" font-size="10" font-weight="bold" font-family="sans-serif">SANCTUARY BUFFER BOUNDARY</text>

  <!-- Timestamp & Coordinates Watermark -->
  <rect x="15" y="15" width="260" height="55" rx="6" fill="#0f172a" opacity="0.85"/>
  <text x="25" y="33" fill="#38bdf8" font-size="11" font-weight="bold" font-family="monospace">FIELD PHOTO: EVIDENCE #EVD-081</text>
  <text x="25" y="47" fill="#f8fafc" font-size="10" font-family="monospace">GPS: 12.4921°N, 75.7042°E | ±2.4m</text>
  <text x="25" y="60" fill="#94a3b8" font-size="9" font-family="monospace">DATE: 2024-03-22 11:45 IST | OFF. DESHMUKH</text>

  <!-- Red Camera Flag Overlay -->
  <rect x="500" y="15" width="85" height="24" rx="4" fill="#dc2626"/>
  <text x="508" y="31" fill="#ffffff" font-size="10" font-weight="bold" font-family="sans-serif">VERIFIED CLEARING</text>
</svg>

